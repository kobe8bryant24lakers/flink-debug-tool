name: Native desktop release

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/release.yml'
      - 'packaging/**'
      - 'scripts/**'
      - 'src/**'
      - 'pom.xml'
      - 'LICENSE'
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version label (vX.Y.Z). For a release, the tag must point to the selected source.'
        required: true
        type: string
      publish:
        description: 'Publish a new release after every platform passes (otherwise only build artifacts).'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  version:
    name: Resolve version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      number: ${{ steps.resolve.outputs.number }}
      release: ${{ steps.resolve.outputs.release }}
    steps:
      - name: Validate version and release mode
        id: resolve
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          MANUAL_TAG: ${{ inputs.tag }}
          PUBLISH: ${{ inputs.publish }}
        run: |
          mode=none
          case "$EVENT" in
            pull_request) tag=v0.0.0 ;;
            push) tag="$GITHUB_REF_NAME"; mode=draft ;;
            workflow_dispatch)
              tag="$MANUAL_TAG"
              if [[ "$PUBLISH" == true ]]; then mode=publish; fi
              ;;
          esac
          if [[ ! "$tag" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Use a version tag in vX.Y.Z format."
            exit 1
          fi
          {
            echo "tag=$tag"
            echo "number=${tag#v}"
            echo "release=$mode"
          } >> "$GITHUB_OUTPUT"

  package:
    name: Package ${{ matrix.platform }}
    needs: version
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x64
            runner: windows-2022
            architecture: x64
            build-java: '17'
            timeout: 50
          - platform: macos-arm64
            runner: macos-15
            architecture: aarch64
            build-java: '21'
            timeout: 20
          - platform: macos-x64
            runner: macos-15-intel
            architecture: x64
            build-java: '21'
            timeout: 20
    env:
      VERSION: ${{ needs.version.outputs.number }}
      PLATFORM: ${{ matrix.platform }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Java for builds and tests
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: ${{ matrix.build-java }}
          architecture: ${{ matrix.architecture }}
          cache: maven
      - name: Restore Windows RocksDB JNI cache
        id: windows-native-cache
        if: runner.os == 'Windows'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/windows-native
          key: windows-native-${{ matrix.runner }}-${{ runner.arch }}-${{ hashFiles('packaging/windows/**') }}
      - name: Build or validate fixed Windows RocksDB JNI
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./packaging/windows/build-rocksdb.ps1
      - name: Cache the verified Windows RocksDB JNI
        if: runner.os == 'Windows' && steps.windows-native-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/windows-native
          key: ${{ steps.windows-native-cache.outputs.cache-primary-key }}
      - name: Build and test on Windows with the replacement RocksDB JNI
        if: runner.os == 'Windows'
        shell: pwsh
        run: mvn -B -ntp -Pwindows-native verify
      - name: Build and test on macOS
        if: runner.os == 'macOS'
        run: mvn -B -ntp verify
      - name: Set up Java 21 for the Windows portable runtime
        if: runner.os == 'Windows'
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
          architecture: x64
      - name: Package and smoke-test Windows desktop
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $jars = @(Get-ChildItem -LiteralPath target -Filter '*-desktop.jar' -File)
          if ($jars.Count -ne 1) { throw "Expected exactly one shaded desktop JAR." }
          ./scripts/package-windows.ps1 -JarPath $jars[0].FullName -OutputDirectory target/release-assets -Version $env:VERSION
          $asset = "target/release-assets/flink-debug-tool-$env:VERSION-windows-x64.zip"
          if (-not (Test-Path -LiteralPath $asset -PathType Leaf)) { throw "Missing Windows ZIP: $asset" }
          Copy-Item -LiteralPath $jars[0].FullName -Destination "target/release-assets/flink-debug-tool-$env:VERSION.jar"
      - name: Package and smoke-test macOS desktop
        if: runner.os == 'macOS'
        shell: bash
        run: |
          jars=(target/*-desktop.jar)
          if [[ "${#jars[@]}" != 1 || ! -f "${jars[0]}" ]]; then
            echo "::error::Expected exactly one shaded desktop JAR."
            exit 1
          fi
          work="$(mktemp -d "$RUNNER_TEMP/flink-desktop.XXXXXX")"
          trap 'rm -rf "$work"' EXIT
          app_name='Flink State Lens'
          # CFBundleVersion requires a positive major number; the ZIP/JAR retain the tag version.
          app_version="$VERSION"
          if [[ "$app_version" == 0.* ]]; then app_version="1.${app_version#0.}"; fi
          jar_name="flink-debug-tool-$VERSION.jar"
          mkdir -p "$work/input" target/release-assets
          cp "${jars[0]}" "$work/input/$jar_name"
          cp LICENSE "$work/input/"
          "$JAVA_HOME/bin/jlink" --add-modules ALL-MODULE-PATH \
            --strip-debug --no-header-files --no-man-pages --output "$work/runtime"
          "$JAVA_HOME/bin/jpackage" --type app-image --name "$app_name" --app-version "$app_version" \
            --input "$work/input" --main-jar "$jar_name" --main-class dev.flinkdebug.Main \
            --runtime-image "$work/runtime" --dest "$work/image" \
            --mac-package-identifier dev.flinkdebug.statelens --mac-package-name 'Flink State Lens' \
            --java-options '--add-opens=java.base/java.util=ALL-UNNAMED'
          asset="target/release-assets/flink-debug-tool-$VERSION-$PLATFORM.zip"
          ditto -c -k --sequesterRsrc --keepParent "$work/image/$app_name.app" "$asset"
          ditto -x -k "$asset" "$work/extracted"
          app="$work/extracted/$app_name.app/Contents"
          without_host_java() {
            env -u JAVA_HOME -u JDK_HOME -u JAVA_TOOL_OPTIONS -u JDK_JAVA_OPTIONS -u _JAVA_OPTIONS \
              PATH=/usr/bin:/bin "$@"
          }
          without_host_java "$app/MacOS/$app_name" --help > "$work/help.txt"
          grep -F -- '--preview' "$work/help.txt"
          cli() {
            without_host_java "$app/runtime/Contents/Home/bin/java" -jar "$app/app/$jar_name" "$@"
          }
          fixture="$work/example savepoint"
          cli --create-example "$fixture"
          operator="$(cli --inspect "$fixture" | jq -er '.operators[0].operatorId | select(test("^[a-f0-9]{32}$"))')"
          cli --preview "$fixture" --operator "$operator" --subtask 0 --limit 1 \
            --state order-map --key-contains alice --map-key-contains last |
            jq -e '(.entries | length == 1) and
              (.entries[0] | .key == "alice" and .mapKey == "last" and .value == "5") and
              (.page | .complete and (.hasMore | not))'
      - name: Record source commit
        shell: bash
        run: git rev-parse HEAD > target/release-assets/build-commit.txt
      - name: Upload verified release assets
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-${{ matrix.platform }}
          path: |
            target/release-assets/flink-debug-tool-${{ needs.version.outputs.number }}-${{ matrix.platform }}.zip
            target/release-assets/flink-debug-tool-${{ needs.version.outputs.number }}.jar
            target/release-assets/build-commit.txt
          compression-level: 0
          if-no-files-found: error

  release:
    name: Assemble GitHub release
    needs: [version, package]
    if: needs.version.outputs.release != 'none'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ needs.version.outputs.tag }}
      VERSION: ${{ needs.version.outputs.number }}
      MODE: ${{ needs.version.outputs.release }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Download verified native artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: desktop-*
          path: staging
      - name: Verify source, assemble checksums, and create release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Refuse to create a tag implicitly or release artifacts from a different commit.
          commit="$(gh api "repos/$GH_REPO/commits/tags/$RELEASE_TAG" --jq .sha)"
          mkdir release-assets
          for platform in windows-x64 macos-arm64 macos-x64; do
            source="staging/desktop-$platform"
            if [[ "$(<"$source/build-commit.txt")" != "$commit" ]]; then
              echo "::error::$platform was not built from the commit tagged $RELEASE_TAG."
              exit 1
            fi
            cp "$source/flink-debug-tool-$VERSION-$platform.zip" release-assets/
          done
          cp "staging/desktop-windows-x64/flink-debug-tool-$VERSION.jar" release-assets/
          cd release-assets
          sha256sum -- ./*.jar ./*.zip | sed 's@  \./@  @' > SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt
          cat > "$RUNNER_TEMP/release-notes.md" <<'NOTES'
          - **Windows x64:** Extract the ZIP and run Flink State Lens.exe from the extracted folder.
          - **macOS:** Extract the ZIP matching Apple silicon (arm64) or Intel (x64), then open Flink State Lens.app.
          - **JAR:** Run with Java 17 or later: java -jar flink-debug-tool-<version>.jar.

          The desktop ZIPs include their own Java runtime. Windows packages are unsigned; macOS packages do not have Developer ID signing or notarization.
          Download SHA256SUMS.txt to verify the files.
          NOTES
          flags=()
          if [[ "$MODE" == draft ]]; then flags+=(--draft); fi
          gh release create "$RELEASE_TAG" --verify-tag --title "Flink State Lens $RELEASE_TAG" \
            --notes-file "$RUNNER_TEMP/release-notes.md" "${flags[@]}" ./*.jar ./*.zip SHA256SUMS.txt
